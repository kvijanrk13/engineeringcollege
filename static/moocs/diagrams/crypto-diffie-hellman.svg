<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="t d"><title id="t">Diffie Hellman key exchange</title><desc id="d">Alice and Bob exchange public values and independently derive the same shared secret.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="760" height="310" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="28" font-size="20" font-weight="700" fill="#123">Diffie–Hellman Exchange</text><rect x="55" y="70" width="180" height="180" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="525" y="70" width="180" height="180" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><g font-size="18" font-weight="700"><text x="145" y="100">ALICE</text><text x="615" y="100">BOB</text></g><g font-size="14"><text x="145" y="135">private a</text><text x="145" y="165">public A = gᵃ mod p</text><text x="145" y="215" font-weight="700">secret K</text><text x="615" y="135">private b</text><text x="615" y="165">public B = gᵇ mod p</text><text x="615" y="215" font-weight="700">secret K</text></g><path d="M240 135h275" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M520 180H245" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><text x="380" y="123" font-size="14" fill="#1d4ed8">A</text><text x="380" y="171" font-size="14" fill="#15803d">B</text><text x="380" y="280" font-size="15" fill="#456">K = gᵃᵇ mod p on both sides</text></g></svg>
