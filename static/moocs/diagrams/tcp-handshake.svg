<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img" aria-labelledby="t d"><title id="t">TCP three-way handshake</title><desc id="d">Client sends SYN, server replies SYN ACK, and client completes with ACK.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="700" height="310" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="350" y="30" font-size="20" font-weight="700" fill="#123">TCP Connection Establishment</text><text x="150" y="65" font-size="18" font-weight="700">CLIENT</text><text x="550" y="65" font-size="18" font-weight="700">SERVER</text><path d="M150 78v205M550 78v205" stroke="#93b7d8" stroke-width="3" stroke-dasharray="7 6"/><path d="M160 110l375 55" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="350" y="120" font-size="16" font-weight="700" fill="#1d4ed8">1. SYN</text><path d="M540 185l-375 45" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><text x="350" y="190" font-size="16" font-weight="700" fill="#15803d">2. SYN + ACK</text><path d="M160 245l375 35" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><text x="350" y="258" font-size="16" font-weight="700" fill="#6d28d9">3. ACK</text></g></svg>
