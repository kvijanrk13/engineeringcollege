<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">C array pointer arithmetic</title><desc id="d">Pointer p begins at array element zero and p plus two points to element two.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#38bdf8"/></marker></defs><rect width="720" height="300" rx="20" fill="#071426"/><g transform="translate(110 105)" fill="#132c47" stroke="#38bdf8" stroke-width="3"><rect width="500" height="72" rx="6"/><path d="M100 0v72M200 0v72M300 0v72M400 0v72"/></g><g fill="#e6f6ff" font-family="Arial" text-anchor="middle"><text x="160" y="150" font-size="22">a[0]</text><text x="260" y="150" font-size="22">a[1]</text><text x="360" y="150" font-size="22">a[2]</text><text x="460" y="150" font-size="22">a[3]</text><text x="560" y="150" font-size="22">a[4]</text><text x="160" y="245" font-size="20">p</text><text x="360" y="245" font-size="20">p + 2</text></g><g stroke="#38bdf8" stroke-width="4" marker-end="url(#a)"><path d="M160 225v-42"/><path d="M360 225v-42"/></g></svg>
