<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-labelledby="t d"><title id="t">CRC generation</title><desc id="d">Dataword with appended zeros divided modulo two by a generator to produce a remainder.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="700" height="280" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="350" y="30" font-size="20" font-weight="700" fill="#123">Cyclic Redundancy Check</text><rect x="55" y="95" width="150" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="130" y="120" font-size="16" font-weight="700">DATAWORD</text><text x="130" y="143" font-size="15">+ r zeros</text><path d="M210 125h80" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="300" y="78" width="170" height="94" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="385" y="112" font-size="16" font-weight="700">MODULO-2</text><text x="385" y="137" font-size="16">DIVISION</text><text x="385" y="160" font-size="13" fill="#456">by generator</text><path d="M475 125h80" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="565" y="95" width="90" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="610" y="132" font-size="15" font-weight="700">REMAINDER</text><path d="M610 160v55H205" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><text x="405" y="237" font-size="15" fill="#15803d">append remainder to dataword</text></g></svg>
