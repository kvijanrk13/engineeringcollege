<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Two phase commit</title><desc id="d">A coordinator sends prepare, receives votes, and broadcasts the final decision to two participants.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="760" height="330" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="28" font-size="20" font-weight="700" fill="#123">Two-Phase Commit</text><g font-size="16" font-weight="700"><text x="110" y="62">PARTICIPANT A</text><text x="380" y="62">COORDINATOR</text><text x="650" y="62">PARTICIPANT B</text></g><path d="M110 75v225M380 75v225M650 75v225" stroke="#93b7d8" stroke-width="3" stroke-dasharray="7 6"/><g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M375 105L120 140M385 105l255 35M120 170l255 35M640 170l-255 35M375 240l-255 35M385 240l255 35"/></g><g font-size="14" font-weight="700"><text x="245" y="112">PREPARE?</text><text x="515" y="112">PREPARE?</text><text x="245" y="191" fill="#15803d">VOTE YES/NO</text><text x="515" y="191" fill="#15803d">VOTE YES/NO</text><text x="245" y="255" fill="#6d28d9">COMMIT / ABORT</text><text x="515" y="255" fill="#6d28d9">COMMIT / ABORT</text></g><text x="380" y="318" font-size="14" fill="#456">Phase 1: vote · Phase 2: decision</text></g></svg>
