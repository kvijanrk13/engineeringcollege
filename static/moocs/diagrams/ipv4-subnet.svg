<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" aria-labelledby="t d"><title id="t">IPv4 slash 26 subnet</title><desc id="d">A 32-bit IPv4 address split into 26 network bits and 6 host bits.</desc><rect width="700" height="250" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="350" y="32" font-size="20" font-weight="700" fill="#123">IPv4 Prefix /26</text><rect x="70" y="85" width="560" height="72" rx="9" fill="#fff" stroke="#264b73" stroke-width="3"/><rect x="70" y="85" width="455" height="72" rx="9" fill="#dbeafe"/><rect x="525" y="85" width="105" height="72" rx="9" fill="#dcfce7"/><path d="M525 85v72" stroke="#264b73" stroke-width="3"/><text x="297" y="116" font-size="17" font-weight="700">NETWORK PREFIX</text><text x="297" y="141" font-size="15">26 bits</text><text x="577" y="116" font-size="17" font-weight="700">HOST</text><text x="577" y="141" font-size="15">6 bits</text><path d="M70 178h560" stroke="#6090bd" stroke-width="2"/><text x="350" y="210" font-size="17" fill="#456">Total addresses = 2⁶</text></g></svg>
