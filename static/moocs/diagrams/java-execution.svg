<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d"><title id="t">Java execution pipeline</title><desc id="d">Java source is compiled to bytecode, loaded by the JVM, and executed on the host.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="720" height="250" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="360" y="30" font-size="20" font-weight="700" fill="#123">Java: Compile Once, Run with a JVM</text><g stroke-width="3"><rect x="35" y="90" width="130" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><rect x="215" y="90" width="130" height="70" rx="12" fill="#fef3c7" stroke="#d97706"/><rect x="395" y="90" width="130" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed"/><rect x="575" y="90" width="110" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/></g><g font-size="16" font-weight="700" fill="#123"><text x="100" y="119">SOURCE</text><text x="100" y="143">.java</text><text x="280" y="119">BYTECODE</text><text x="280" y="143">.class</text><text x="460" y="119">JVM</text><text x="460" y="143">load + execute</text><text x="630" y="119">HOST</text><text x="630" y="143">machine</text></g><path d="M170 125h38M350 125h38M530 125h38" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="190" y="104" font-size="12">javac</text></g></svg>
