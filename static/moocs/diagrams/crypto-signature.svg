<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-labelledby="t d"><title id="t">Digital signature workflow</title><desc id="d">A signer hashes a message and signs the digest with a private key; a verifier uses the public key.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="780" height="310" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="390" y="28" font-size="20" font-weight="700" fill="#123">Digital Signature</text><rect x="30" y="100" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="205" y="100" width="120" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><rect x="380" y="90" width="140" height="80" rx="10" fill="#fee2e2" stroke="#d93b4a" stroke-width="3"/><rect x="605" y="90" width="140" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><g font-size="15" font-weight="700"><text x="90" y="136">MESSAGE</text><text x="265" y="136">HASH</text><text x="450" y="120">SIGN DIGEST</text><text x="450" y="145">private key</text><text x="675" y="120">VERIFY</text><text x="675" y="145">public key</text></g><g stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M155 130h43M330 130h43M525 130h73"/></g><text x="390" y="225" font-size="15" fill="#456">verification compares the recovered digest with a fresh message hash</text><text x="390" y="253" font-size="15" fill="#456">integrity + origin authentication + nonrepudiation</text></g></svg>
