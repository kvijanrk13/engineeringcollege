<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="t d"><title id="t">Symmetric encryption</title><desc id="d">Plaintext is encrypted and decrypted using the same shared secret key.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="760" height="270" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="28" font-size="20" font-weight="700" fill="#123">Symmetric Cipher Model</text><rect x="25" y="105" width="120" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="200" y="90" width="130" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><rect x="430" y="90" width="130" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><rect x="615" y="105" width="120" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><g font-size="16" font-weight="700"><text x="85" y="141">PLAINTEXT</text><text x="265" y="130">ENCRYPT</text><text x="495" y="130">DECRYPT</text><text x="675" y="141">PLAINTEXT</text></g><g stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M150 135h43M335 135h88M565 135h43"/></g><path d="M265 68v18M495 68v18" stroke="#d93b4a" stroke-width="4" marker-end="url(#a)"/><text x="380" y="62" font-size="16" font-weight="700" fill="#a61b2b">SHARED SECRET KEY K</text><text x="380" y="225" font-size="15" fill="#456">ciphertext crosses the untrusted channel</text></g></svg>
