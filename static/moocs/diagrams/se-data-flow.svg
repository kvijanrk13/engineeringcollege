<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t d"><title id="t">Data flow diagram</title><desc id="d">A student sends answers to an evaluate exam process that reads a question bank and returns a result.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="760" height="290" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="28" font-size="20" font-weight="700" fill="#123">Level-0 Data Flow</text><rect x="35" y="100" width="145" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="380" cy="140" r="68" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><path d="M575 95h150v90H575M575 107h150" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><g font-size="16" font-weight="700"><text x="107" y="145">STUDENT</text><text x="380" y="134">EVALUATE</text><text x="380" y="157">EXAM</text><text x="650" y="145">QUESTION BANK</text></g><g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M185 125h120M305 160H185M570 125H450"/></g><g font-size="13" fill="#456"><text x="245" y="113">answers</text><text x="245" y="181">result</text><text x="510" y="113">questions + key</text></g></g></svg>
