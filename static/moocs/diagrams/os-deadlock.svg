<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="t d"><title id="t">Resource allocation cycle</title><desc id="d">Two processes each hold one single-instance resource and request the other.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#d93b4a"/></marker></defs><rect width="700" height="300" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="350" y="30" font-size="20" font-weight="700" fill="#123">Resource-Allocation Graph</text><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><circle cx="190" cy="100" r="42"/><circle cx="510" cy="210" r="42"/></g><g fill="#fef3c7" stroke="#d97706" stroke-width="3"><rect x="465" y="58" width="90" height="84" rx="8"/><rect x="145" y="168" width="90" height="84" rx="8"/></g><g font-size="19" font-weight="700"><text x="190" y="107">P1</text><text x="510" y="217">P2</text><text x="510" y="107">R1</text><text x="190" y="217">R2</text></g><g fill="none" stroke="#d93b4a" stroke-width="4" marker-end="url(#a)"><path d="M235 100h220M510 145v16M465 210H245M190 165v-16"/></g><text x="350" y="282" font-size="15" fill="#a61b2b">P1 → R1 → P2 → R2 → P1</text></g></svg>
