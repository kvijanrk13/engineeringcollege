<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="t d"><title id="t">AES round structure</title><desc id="d">A simplified AES round applies byte substitution, row shifting, column mixing, and round-key addition.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="760" height="280" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="30" font-size="20" font-weight="700" fill="#123">Simplified AES Round</text><g stroke-width="3"><rect x="30" y="100" width="120" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="185" y="100" width="120" height="65" rx="10" fill="#dcfce7" stroke="#16a34a"/><rect x="340" y="100" width="120" height="65" rx="10" fill="#fef3c7" stroke="#d97706"/><rect x="495" y="100" width="130" height="65" rx="10" fill="#ede9fe" stroke="#7c3aed"/><rect x="665" y="108" width="65" height="50" rx="25" fill="#fee2e2" stroke="#d93b4a"/></g><g font-size="15" font-weight="700"><text x="90" y="127">SUB</text><text x="90" y="149">BYTES</text><text x="245" y="127">SHIFT</text><text x="245" y="149">ROWS</text><text x="400" y="127">MIX</text><text x="400" y="149">COLUMNS</text><text x="560" y="127">ADD ROUND</text><text x="560" y="149">KEY</text><text x="697" y="139">STATE</text></g><g stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M155 132h23M310 132h23M465 132h23M630 132h28"/></g><path d="M560 70v25" stroke="#d93b4a" stroke-width="4" marker-end="url(#a)"/><text x="560" y="62" font-size="14" fill="#a61b2b">round key</text><text x="380" y="220" font-size="15" fill="#456">the final AES round omits MixColumns</text></g></svg>
