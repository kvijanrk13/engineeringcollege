<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">C dynamic memory allocation</title><desc id="d">A stack pointer references a dynamically allocated heap block that is later released with free.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#f59e0b"/></marker></defs><rect width="720" height="300" rx="20" fill="#071426"/><rect x="70" y="85" width="190" height="125" rx="12" fill="#273146" stroke="#94a3b8" stroke-width="3"/><rect x="450" y="65" width="200" height="165" rx="12" fill="#3b2810" stroke="#f59e0b" stroke-width="3"/><path d="M260 145h175" stroke="#f59e0b" stroke-width="5" marker-end="url(#a)"/><g fill="#f8fafc" font-family="Arial" text-anchor="middle"><text x="165" y="115" font-size="20">STACK</text><text x="165" y="165" font-family="monospace" font-size="23">int *p</text><text x="550" y="103" font-size="20">HEAP</text><text x="550" y="155" font-family="monospace" font-size="20">malloc block</text><text x="550" y="195" fill="#fcd34d" font-size="18">release with free(p)</text></g></svg>
