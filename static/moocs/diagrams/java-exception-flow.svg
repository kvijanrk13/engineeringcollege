<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" role="img" aria-labelledby="t d"><title id="t">Java exception flow</title><desc id="d">A matching exception transfers control from try to catch and then finally.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="700" height="285" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="350" y="30" font-size="20" font-weight="700" fill="#123">Exception Control Flow</text><rect x="55" y="95" width="150" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="275" y="95" width="150" height="70" rx="12" fill="#fff0f2" stroke="#d93b4a" stroke-width="3"/><rect x="495" y="95" width="150" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><g font-size="18" font-weight="700"><text x="130" y="136">try</text><text x="350" y="136">catch</text><text x="570" y="136">finally</text></g><path d="M210 130h58M430 130h58" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="239" y="112" font-size="13" fill="#a61b2b">matching throw</text><path d="M130 170v65h440v-63" fill="none" stroke="#6090bd" stroke-width="3" marker-end="url(#a)"/><text x="350" y="254" font-size="14" fill="#456">normal path also reaches finally</text></g></svg>
