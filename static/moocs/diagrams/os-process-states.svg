<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="t d"><title id="t">Process states</title><desc id="d">Transitions among new, ready, running, waiting, and terminated process states.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="760" height="310" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="28" font-size="20" font-weight="700" fill="#123">Process State Transitions</text><g stroke="#2563eb" stroke-width="3"><rect x="25" y="105" width="105" height="54" rx="22" fill="#dbeafe"/><rect x="180" y="105" width="115" height="54" rx="22" fill="#dcfce7"/><rect x="350" y="105" width="120" height="54" rx="22" fill="#fef3c7"/><rect x="350" y="220" width="120" height="54" rx="22" fill="#ede9fe"/><rect x="575" y="105" width="150" height="54" rx="22" fill="#fee2e2"/></g><g font-size="16" font-weight="700"><text x="77" y="138">NEW</text><text x="237" y="138">READY</text><text x="410" y="138">RUNNING</text><text x="410" y="253">WAITING</text><text x="650" y="138">TERMINATED</text></g><g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"><path d="M135 132h38M300 132h43M475 132h93M410 165v48M350 247H237v-81"/></g><g font-size="12" fill="#456"><text x="154" y="118">admit</text><text x="321" y="118">dispatch</text><text x="520" y="118">exit</text><text x="452" y="190">I/O wait</text><text x="285" y="236">I/O complete</text></g></g></svg>
