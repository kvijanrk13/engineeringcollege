<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d"><title id="t">CPU scheduling ready queue</title><desc id="d">Four ready processes with different predicted CPU burst lengths.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="720" height="280" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="360" y="30" font-size="20" font-weight="700" fill="#123">Ready Queue at Time 0</text><g stroke="#2563eb" stroke-width="3"><rect x="45" y="90" width="120" height="80" rx="10" fill="#dbeafe"/><rect x="180" y="90" width="120" height="80" rx="10" fill="#dcfce7"/><rect x="315" y="90" width="120" height="80" rx="10" fill="#fef3c7"/><rect x="450" y="90" width="120" height="80" rx="10" fill="#ede9fe"/><rect x="620" y="102" width="70" height="56" rx="28" fill="#fee2e2"/></g><g font-size="17" font-weight="700"><text x="105" y="122">P1</text><text x="105" y="149">8 ms</text><text x="240" y="122">P2</text><text x="240" y="149">4 ms</text><text x="375" y="122">P3</text><text x="375" y="149">2 ms</text><text x="510" y="122">P4</text><text x="510" y="149">6 ms</text><text x="655" y="136">CPU</text></g><path d="M575 130h38" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="360" y="220" font-size="16" fill="#456">Which process should a nonpreemptive SJF scheduler dispatch first?</text></g></svg>
