<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Department pass-count comparison</title>
  <desc id="desc">Department A has 80 students and 60 passes. Department B has 120 students and 72 passes.</desc>
  <rect width="720" height="300" rx="24" fill="#f7fbff"/>
  <g stroke="#22324d" stroke-width="3" fill="none"><path d="M90 35v215h560"/><path d="M90 195h560M90 140h560M90 85h560" opacity=".18"/></g>
  <g font-family="Arial, sans-serif" fill="#22324d"><text x="25" y="255" font-size="16">0</text><text x="18" y="200" font-size="16">40</text><text x="18" y="145" font-size="16">80</text><text x="10" y="90" font-size="16">120</text></g>
  <g><rect x="190" y="140" width="100" height="110" rx="8" fill="#32a6a0"/><rect x="430" y="85" width="100" height="165" rx="8" fill="#5577dd"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17233a"><text x="240" y="275" font-size="18">Department A: 80</text><text x="480" y="275" font-size="18">Department B: 120</text><text x="240" y="130" font-size="18" font-weight="700">75% pass</text><text x="480" y="75" font-size="18" font-weight="700">60% pass</text></g>
</svg>
