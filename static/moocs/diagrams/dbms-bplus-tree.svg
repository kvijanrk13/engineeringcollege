<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">B plus tree</title><desc id="d">A B plus tree whose internal nodes guide search and whose linked leaves contain data entries.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#16a34a"/></marker></defs><rect width="760" height="300" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="28" font-size="20" font-weight="700" fill="#123">B+ Tree Index</text><rect x="315" y="50" width="130" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="380" y="80" font-size="17" font-weight="700">30 | 60</text><g stroke="#6090bd" stroke-width="3"><path d="M335 100l-190 70M380 100v70M425 100l190 70"/></g><g fill="#dcfce7" stroke="#16a34a" stroke-width="3"><rect x="55" y="170" width="180" height="58" rx="8"/><rect x="290" y="170" width="180" height="58" rx="8"/><rect x="525" y="170" width="180" height="58" rx="8"/></g><g font-size="16" font-weight="700"><text x="145" y="204">10 | 20 | 25</text><text x="380" y="204">30 | 45 | 55</text><text x="615" y="204">60 | 75 | 90</text></g><path d="M238 199h45M473 199h45" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><text x="380" y="265" font-size="15" fill="#456">linked leaf level contains data entries</text></g></svg>
