<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-labelledby="t d"><title id="t">Spiral process model</title><desc id="d">A risk-driven software process grows through repeated planning, risk analysis, engineering, and evaluation cycles.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="700" height="330" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="350" y="28" font-size="20" font-weight="700" fill="#123">Risk-Driven Spiral Model</text><path d="M350 175c25-35 75-15 68 28-10 61-105 72-146 14-51-72 14-165 108-157 119 10 157 151 75 227" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><path d="M350 50v250M100 175h500" stroke="#b9c9da" stroke-width="2"/><g font-size="15" font-weight="700"><text x="475" y="92">PLAN</text><text x="223" y="92">RISK ANALYSIS</text><text x="218" y="270">ENGINEER</text><text x="490" y="270">EVALUATE</text></g><circle cx="350" cy="175" r="8" fill="#d93b4a"/><text x="350" y="317" font-size="14" fill="#456">each outward loop develops a more complete increment</text></g></svg>
