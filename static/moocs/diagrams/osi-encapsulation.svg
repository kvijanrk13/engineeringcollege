<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="t d"><title id="t">OSI encapsulation</title><desc id="d">Application data gains transport, network, and link headers before transmission as bits.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="700" height="300" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="350" y="28" font-size="20" font-weight="700" fill="#123">Encapsulation at the Sender</text><g font-size="15" font-weight="700"><rect x="265" y="50" width="170" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="350" y="74">APPLICATION DATA</text><rect x="225" y="105" width="250" height="38" rx="7" fill="#dcfce7" stroke="#16a34a"/><text x="350" y="129">TCP H | DATA</text><rect x="185" y="160" width="330" height="38" rx="7" fill="#fef3c7" stroke="#d97706"/><text x="350" y="184">IP H | TCP H | DATA</text><rect x="145" y="215" width="410" height="38" rx="7" fill="#ede9fe" stroke="#7c3aed"/><text x="350" y="239">FRAME H | IP H | TCP H | DATA | T</text></g><path d="M350 90v13M350 145v13M350 200v13M350 255v25" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="455" y="283" font-size="14" fill="#456">Bits to medium</text></g></svg>
