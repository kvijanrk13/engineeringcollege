<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d"><title id="t">Euler graph</title><desc id="d">A four-vertex cycle in which every vertex has degree two.</desc><rect width="640" height="280" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="320" y="30" font-size="20" font-weight="700" fill="#123">Connected Graph</text><g stroke="#6090bd" stroke-width="5"><path d="M200 75H440L510 210H130z"/></g><g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><circle cx="200" cy="75" r="27"/><circle cx="440" cy="75" r="27"/><circle cx="510" cy="210" r="27"/><circle cx="130" cy="210" r="27"/></g><g font-size="18" font-weight="700" fill="#123"><text x="200" y="82">A</text><text x="440" y="82">B</text><text x="510" y="217">C</text><text x="130" y="217">D</text></g><text x="320" y="260" font-size="17" fill="#456">degree(A)=degree(B)=degree(C)=degree(D)=2</text></g></svg>
