<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Java thread states</title><desc id="d">Simplified transitions among new, runnable, running, waiting, and terminated states.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="760" height="300" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="28" font-size="20" font-weight="700" fill="#123">Simplified Thread Lifecycle</text><g stroke="#2563eb" stroke-width="3"><rect x="25" y="105" width="115" height="55" rx="11" fill="#dbeafe"/><rect x="190" y="105" width="125" height="55" rx="11" fill="#dcfce7"/><rect x="365" y="105" width="125" height="55" rx="11" fill="#fef3c7"/><rect x="365" y="215" width="125" height="55" rx="11" fill="#ede9fe"/><rect x="590" y="105" width="140" height="55" rx="11" fill="#fee2e2"/></g><g font-size="16" font-weight="700"><text x="82" y="139">NEW</text><text x="252" y="139">RUNNABLE</text><text x="427" y="139">RUNNING</text><text x="427" y="249">WAITING</text><text x="660" y="139">TERMINATED</text></g><g stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M145 132h38M320 132h38M495 132h88M427 166v42M365 242H252v-75"/></g><g font-size="12" fill="#456"><text x="164" y="119">start()</text><text x="339" y="119">scheduled</text><text x="540" y="119">run ends</text><text x="470" y="190">wait()</text><text x="288" y="231">notify / timeout</text></g></g></svg>
