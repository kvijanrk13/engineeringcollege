<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d"><title id="t">Recursive C call stack</title><desc id="d">Three function activation records each contain parameters local variables and return information.</desc><rect width="720" height="340" rx="20" fill="#071426"/><g transform="translate(150 40)" fill="#143027" stroke="#22c55e" stroke-width="3"><rect y="180" width="420" height="75" rx="10"/><rect y="90" width="420" height="75" rx="10"/><rect width="420" height="75" rx="10"/></g><g fill="#dcfce7" font-family="Arial" text-anchor="middle"><text x="360" y="72" font-size="22">factorial(1): n, local state, return</text><text x="360" y="162" font-size="22">factorial(2): n, local state, return</text><text x="360" y="252" font-size="22">factorial(3): n, local state, return</text><text x="360" y="320" font-size="18">CALL STACK</text></g></svg>
