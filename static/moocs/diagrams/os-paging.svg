<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Paging address translation</title><desc id="d">A logical page number indexes a page table to obtain a physical frame number while retaining the offset.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2563eb"/></marker></defs><rect width="760" height="300" rx="18" fill="#f8fbff"/><g font-family="Arial" text-anchor="middle"><text x="380" y="28" font-size="20" font-weight="700" fill="#123">Paging Translation</text><rect x="35" y="92" width="185" height="70" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M130 92v70" stroke="#2563eb" stroke-width="2"/><text x="82" y="120" font-size="15" font-weight="700">PAGE</text><text x="82" y="145" font-size="18">p</text><text x="175" y="120" font-size="15" font-weight="700">OFFSET</text><text x="175" y="145" font-size="18">d</text><rect x="300" y="70" width="155" height="155" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="377" y="96" font-size="16" font-weight="700">PAGE TABLE</text><path d="M315 115h125M315 150h125M315 185h125" stroke="#b9c9da" stroke-width="2"/><text x="377" y="140" font-size="15">p → frame f</text><rect x="545" y="92" width="180" height="70" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><path d="M635 92v70" stroke="#16a34a" stroke-width="2"/><text x="590" y="120" font-size="15" font-weight="700">FRAME</text><text x="590" y="145" font-size="18">f</text><text x="680" y="120" font-size="15" font-weight="700">OFFSET</text><text x="680" y="145" font-size="18">d</text><path d="M225 126h67M462 126h75" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="380" y="265" font-size="15" fill="#456">physical address = frame number + unchanged offset</text></g></svg>
