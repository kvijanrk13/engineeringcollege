<svg xmlns="http://www.w3.org/2000/svg" width="747" height="795" viewBox="0 0 747 795" role="img" aria-labelledby="title desc">
  <title id="title">Book Bank LMS collaboration diagram</title>
  <desc id="desc">Collaboration among Librarian, Member, Book, Transaction and Bill with numbered messages for validation, details, fines, billing and record updates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#970909"/></marker>
    <style>.link{fill:none;stroke:#b32222;stroke-width:1}.msg{fill:none;stroke:#970909;stroke-width:1.1;marker-end:url(#arrow)}.obj{fill:#fffdb0;stroke:#b32222;stroke-width:1.2}.label{font:14px Arial,sans-serif;fill:#111}.heading{font:700 24px Georgia,serif;fill:#111}</style>
  </defs>
  <rect width="747" height="795" fill="white"/>
  <text x="7" y="44" class="heading">3. Collaboration Diagram</text>
  <g class="obj"><rect x="31" y="224" width="74" height="54"/><rect x="230" y="129" width="73" height="54"/><rect x="325" y="408" width="73" height="54"/><rect x="660" y="642" width="81" height="55"/><rect x="299" y="716" width="73" height="53"/></g>
