  <g class="link"><path d="M105 275 325 416"/><path d="M277 183 352 408"/><path d="M398 448 660 643"/><path d="M359 462 338 716"/></g>
  <g class="msg"><path d="M354 335 338 280"/><path d="M399 319 389 273"/><path d="M505 268 488 216"/><path d="M430 381v54h11v-55"/><path d="M217 410 184 386"/><path d="M415 642v55"/><path d="M277 647 282 592"/><path d="M505 545 554 554"/></g>
  <g class="label"><text x="285" y="312">1 : validateMember()</text><text x="519" y="524">2 : getDetails()</text><text x="338" y="271">3 : getMemberType()</text><text x="356" y="596">4</text><text x="346" y="616">&lt;&lt;create&gt;&gt;</text><text x="448" y="400">5 : calculateFine()</text><text x="378" y="665">6 : addBillDetails()</text><text x="231" y="624">7 : billPaid()</text><text x="96" y="410">8 : updateStatus()</text><text x="423" y="245">9 : updateMemberRecord()</text></g>
