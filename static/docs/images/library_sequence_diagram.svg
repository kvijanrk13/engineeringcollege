<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="890" viewBox="0 0 1540 890" role="img" aria-label="Book Issue, Return and Fine Payment - Sequence Diagram">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#222"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f7f7"/><g font-family="Arial,Helvetica,sans-serif" stroke="#222" stroke-width="1.4"><text x="770.0" y="30" font-size="22" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Book Issue, Return and Fine Payment - Sequence Diagram</text><rect x="18" y="55" width="144" height="42" fill="#fff"/><text x="90" y="81" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Student</text><path d="M90,97 V850" stroke-dasharray="6 5"/><rect x="228" y="55" width="144" height="42" fill="#fff"/><text x="300" y="81" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Browser UI</text><path d="M300,97 V850" stroke-dasharray="6 5"/><rect x="463" y="55" width="144" height="42" fill="#fff"/><text x="535" y="81" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Django Views</text><path d="M535,97 V850" stroke-dasharray="6 5"/><rect x="708" y="55" width="144" height="42" fill="#fff"/><text x="780" y="81" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Models / ORM</text><path d="M780,97 V850" stroke-dasharray="6 5"/><rect x="938" y="55" width="144" height="42" fill="#fff"/><text x="1010" y="81" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">PostgreSQL</text><path d="M1010,97 V850" stroke-dasharray="6 5"/><rect x="1163" y="55" width="144" height="42" fill="#fff"/><text x="1235" y="81" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Librarian</text><path d="M1235,97 V850" stroke-dasharray="6 5"/><rect x="1378" y="55" width="144" height="42" fill="#fff"/><text x="1450" y="81" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Razorpay</text><path d="M1450,97 V850" stroke-dasharray="6 5"/><path d="M90,125 L300,125" fill="none" marker-end="url(#arrow)"/><rect x="140.0" y="105.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="195.0" y="119.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">1: request book</text><path d="M300,165 L535,165" fill="none" marker-end="url(#arrow)"/><rect x="362.5" y="145.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="417.5" y="159.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">2: issuerequest(bookID)</text><path d="M535,205 L780,205" fill="none" marker-end="url(#arrow)"/><rect x="602.5" y="185.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="657.5" y="199.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">3: get_or_create(Issue)</text><path d="M780,245 L1010,245" fill="none" marker-end="url(#arrow)"/><rect x="840.0" y="225.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="895.0" y="239.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">4: INSERT / SELECT</text><path d="M1010,285 L780,285" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="840.0" y="265.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="895.0" y="279.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">5: issue record</text><path d="M535,325 L300,325" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="362.5" y="305.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="417.5" y="319.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">6: request confirmed</text><path d="M1235,375 L535,375" fill="none" marker-end="url(#arrow)"/><rect x="830.0" y="355.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="885.0" y="369.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">7: approve issue</text><path d="M535,415 L780,415" fill="none" marker-end="url(#arrow)"/><rect x="602.5" y="395.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="657.5" y="409.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">8: set issued_at, return_date</text><path d="M780,455 L1010,455" fill="none" marker-end="url(#arrow)"/><rect x="840.0" y="435.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="895.0" y="449.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">9: UPDATE Issue</text><path d="M535,495 L1235,495" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="830.0" y="475.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="885.0" y="489.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">10: issued</text><path d="M1235,545 L535,545" fill="none" marker-end="url(#arrow)"/><rect x="830.0" y="525.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="885.0" y="539.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">11: return book</text><path d="M535,585 L780,585" fill="none" marker-end="url(#arrow)"/><rect x="602.5" y="565.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="657.5" y="579.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">12: calcFine(issue), mark returned</text><path d="M780,625 L1010,625" fill="none" marker-end="url(#arrow)"/><rect x="840.0" y="605.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="895.0" y="619.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">13: UPDATE Issue / Fine</text><path d="M90,675 L300,675" fill="none" marker-end="url(#arrow)"/><rect x="140.0" y="655.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="195.0" y="669.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">14: pay fine</text><path d="M300,715 L535,715" fill="none" marker-end="url(#arrow)"/><rect x="362.5" y="695.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="417.5" y="709.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">15: payfine(fineID)</text><path d="M535,755 L1450,755" fill="none" marker-end="url(#arrow)"/><rect x="937.5" y="735.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="992.5" y="749.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">16: create order</text><path d="M1450,795 L535,795" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="937.5" y="775.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="992.5" y="789.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">17: order / signature</text><path d="M535,835 L780,835" fill="none" marker-end="url(#arrow)"/><rect x="602.5" y="815.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="657.5" y="829.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">18: verify &amp; mark paid</text></g></svg>