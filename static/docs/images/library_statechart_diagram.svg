<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="600" viewBox="0 0 1540 600" role="img" aria-label="Issue Lifecycle - Statechart Diagram">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#fff" stroke="#222"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f7f7"/><g font-family="Arial,Helvetica,sans-serif" stroke="#222" stroke-width="1.4"><text x="770.0" y="30" font-size="22" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Issue Lifecycle - Statechart Diagram</text><circle cx="65" cy="265" r="12" fill="#222"/><rect x="130" y="224" width="230" height="82" rx="18" fill="#fff"/><text x="245.0" y="258" font-size="17" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Requested</text><text x="245.0" y="283" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">issued = false</text><rect x="465" y="224" width="230" height="82" rx="18" fill="#fff"/><text x="580.0" y="258" font-size="17" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Issued</text><text x="580.0" y="283" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">issued = true</text><rect x="805" y="80" width="230" height="82" rx="18" fill="#fff"/><text x="920.0" y="114" font-size="17" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Overdue</text><text x="920.0" y="139" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">now &gt; return_date</text><rect x="805" y="375" width="230" height="82" rx="18" fill="#fff"/><text x="920.0" y="409" font-size="17" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Returned</text><text x="920.0" y="434" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">returned = true</text><rect x="1155" y="80" width="250" height="82" rx="18" fill="#fff"/><text x="1280.0" y="114" font-size="17" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Fine Outstanding</text><text x="1280.0" y="139" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">Fine.paid = false</text><rect x="1155" y="375" width="250" height="82" rx="18" fill="#fff"/><text x="1280.0" y="409" font-size="17" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">Closed</text><text x="1280.0" y="434" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">returned and no balance</text><circle cx="1480" cy="416" r="16" fill="#fff"/><circle cx="1480" cy="416" r="9" fill="#222"/><path d="M77,265 L130,265" fill="none" marker-end="url(#arrow)"/><rect x="48.5" y="245.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="103.5" y="259.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">request</text><path d="M360,265 L465,265" fill="none" marker-end="url(#arrow)"/><rect x="357.5" y="245.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="412.5" y="259.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">approve / issue</text><path d="M695,245 L805,135" fill="none" marker-end="url(#arrow)"/><rect x="695.0" y="170.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="750.0" y="184.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">due date passes</text><path d="M695,285 L805,395" fill="none" marker-end="url(#arrow)"/><rect x="695.0" y="320.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="750.0" y="334.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">return on time</text><path d="M920,162 L920,375" fill="none" marker-end="url(#arrow)"/><rect x="865.0" y="248.5" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="920.0" y="262.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">return / calculate fine</text><path d="M1035,120 L1155,120" fill="none" marker-end="url(#arrow)"/><rect x="1040.0" y="100.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="1095.0" y="114.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">amount &gt; 0</text><path d="M1035,416 L1155,416" fill="none" marker-end="url(#arrow)"/><rect x="1040.0" y="396.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="1095.0" y="410.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">amount = 0</text><path d="M1280,162 L1280,375" fill="none" marker-end="url(#arrow)"/><rect x="1225.0" y="248.5" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="1280.0" y="262.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">pay or waive</text><path d="M1405,416 L1464,416" fill="none" marker-end="url(#arrow)"/><rect x="1379.5" y="396.0" width="110" height="18" fill="#f7f7f7" stroke="none"/><text x="1434.5" y="410.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#111" stroke="none">complete</text><path d="M245,306 L245,525 L1280,525 L1280,457" fill="none" marker-end="url(#open)" stroke-dasharray="7 5"/><rect x="636" y="500" width="128" height="20" rx="3" fill="#f7f7f7" stroke="none"/><text x="700" y="515" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">cancel / clear pending</text></g></svg>