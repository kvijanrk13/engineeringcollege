ight="20" rx="3" fill="#f7f7f7" stroke="none"/><text x="1015.0" y="604.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#111" stroke="none">4.4: mark Fine paid</text><path d="M580,325 H917 L935,343 V385 H580 Z M917,325 V343 H935" fill="#fff"/><text x="590" y="349" font-size="13" text-anchor="start" font-weight="normal" fill="#111" stroke="none">Message numbers show execution order.</text><text x="590" y="367" font-size="13" text-anchor="start" font-weight="normal" fill="#111" stroke="none">Links show collaborating runtime objects.</text></g></svg>