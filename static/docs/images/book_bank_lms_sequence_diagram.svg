<svg xmlns="http://www.w3.org/2000/svg" width="592" height="581" viewBox="0 0 592 581" role="img" aria-labelledby="title desc">
  <title id="title">Book Bank LMS sequence diagram</title>
  <desc id="desc">Sequence interactions among Librarian, Book, Member, Transaction and Bill for issuing a book, calculating a fine, paying a bill and updating records.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ad2020"/></marker>
    <style>.msg{fill:none;stroke:#ad2020;stroke-width:1;marker-end:url(#arrow)}.life{stroke:#222;stroke-width:1;stroke-dasharray:2 3}.box{fill:#fffac4;stroke:#cf5a43;stroke-width:.8}.active{fill:#fffac4;stroke:#cf5a43;stroke-width:.8}.txt{font:8px Arial,sans-serif;fill:#111}.head{font:700 18px Georgia,serif;fill:#111}</style>
  </defs>
  <rect width="592" height="581" fill="white"/>
  <text x="7" y="27" class="head">2. Sequence Diagram</text>
  <g class="box"><rect x="21" y="94" width="63" height="28"/><rect x="151" y="91" width="52" height="28"/><rect x="266" y="91" width="61" height="28"/><rect x="396" y="94" width="73" height="28"/><rect x="542" y="205" width="36" height="29"/></g>
  <g class="txt" text-anchor="middle"><text x="52" y="106" text-decoration="underline">: Librarian</text><text x="177" y="103" text-decoration="underline">: Book</text><text x="297" y="103" text-decoration="underline">: Member</text><text x="432" y="106" text-decoration="underline">: Transaction</text><text x="560" y="217" text-decoration="underline">: Bill</text></g>
  <g class="life"><path d="M53 122V568"/><path d="M177 119V568"/><path d="M297 119V568"/><path d="M432 122V568"/><path d="M565 234V568"/></g>
  <g class="active"><rect x="294" y="151" width="7" height="19"/><rect x="429" y="197" width="7" height="19"/><rect x="294" y="246" width="7" height="19"/><rect x="562" y="280" width="7" height="20"/><rect x="49" y="328" width="8" height="128"/><rect x="53" y="407" width="7" height="19"/><rect x="562" y="380" width="7" height="55"/><rect x="173" y="488" width="8" height="21"/><rect x="294" y="526" width="7" height="20"/></g>
  <g class="msg"><path d="M53 151H294"/><path d="M53 197H429"/><path d="M53 246H294"/><path d="M53 280H562"/><path d="M53 315H72V328H57"/><path d="M57 380H562"/><path d="M562 407H60"/><path d="M53 488H173"/><path d="M53 526H294"/></g>
  <g class="txt"><text x="199" y="147">1 : validateMember()</text><text x="334" y="193">2 : getDetails()</text><text x="202" y="242">3 : getMemberType()</text><text x="462" y="276">4 &lt;&lt;create&gt;&gt;</text><text x="77" y="323">5 : calculateFine()</text><text x="452" y="376">6 : addBillDetails()</text><text x="455" y="403">7 : billPaid()</text><text x="83" y="484">8 : updateStatus()</text><text x="196" y="522">9 : updateMemberRecord()</text></g>
  <rect x="589" width="3" height="581" fill="#15115f"/>
</svg>
