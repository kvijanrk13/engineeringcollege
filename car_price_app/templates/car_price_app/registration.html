{% extends "car_price_app/base.html" %}

{% block content %}
  <h1>Customer Depreciation Registration</h1>
  <section>
    <p>Enter your details to calculate the predicted depreciation value for a second-hand car purchase.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        {% for field in form %}
          <div>
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
          </div>
        {% endfor %}
      </div>
      <div class="actions">
        <button type="submit">Continue to Depreciation Prediction</button>
      </div>
    </form>
  </section>
{% endblock %}
