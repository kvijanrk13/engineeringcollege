<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAAC Login | Engineering College</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #172554; background: #f3f6fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; background: radial-gradient(ellipse at top left, #dbeafe 0, transparent 45%), #f3f6fc; }
    .card { width: min(100%, 470px); background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px; box-shadow: 0 20px 60px #1e3a8a14; }
    .eyebrow { color: #2563eb; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 800; }
    h1 { margin: 8px 0 6px; font-size: 27px; letter-spacing: -.03em; }
    .intro { margin: 0 0 24px; color: #64748b; font-size: 14px; }
    .systems { display: flex; gap: 8px; padding: 5px; margin-bottom: 22px; background: #f1f5f9; border-radius: 12px; }
    .systems a { flex: 1; text-align: center; padding: 10px; border-radius: 9px; font-weight: 750; font-size: 14px; text-decoration: none; color: #64748b; }
    .systems .active { background: #fff; color: #1d4ed8; box-shadow: 0 1px 4px #0f172a18; }
    .roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 5px; background: #f1f5f9; border-radius: 12px; }
    .role { border: 0; border-radius: 9px; padding: 10px 3px; color: #64748b; background: transparent; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .role[aria-selected="true"] { color: #1d4ed8; background: #fff; box-shadow: 0 1px 4px #0f172a18; }
    form { margin-top: 22px; }
    label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 700; color: #334155; }
    input { width: 100%; margin-bottom: 16px; padding: 12px 13px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; font-size: 15px; outline: none; }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px #3b82f622; }
    .submit { width: 100%; border: 0; border-radius: 10px; padding: 13px; background: #1d4ed8; color: white; font: inherit; font-weight: 750; cursor: pointer; }
    .submit:hover { background: #1e40af; }
    .error { margin-top: 16px; padding: 11px 13px; border-radius: 9px; background: #fef2f2; color: #b91c1c; font-size: 14px; }
    .hint { margin: 18px 0 0; text-align: center; color: #64748b; font-size: 12px; }
    @media (max-width: 390px) { .card { padding: 24px 18px; } .role { font-size: 11px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Institutional quality portal</div>
    <h1>NAAC Accreditation</h1>
    <p class="intro">Sign in to access the NAAC accreditation workspace.</p>
    <nav class="systems" aria-label="Accreditation system">
      <a href="{% url 'dashboard:nba_login' %}">NBA</a>
      <a class="active" href="{% url 'dashboard:naac_login' %}" aria-current="page">NAAC</a>
    </nav>
    <form method="post">
      {% csrf_token %}
      <div class="roles" role="tablist" aria-label="Choose your role">
        {% for role in roles %}<button class="role" type="button" role="tab" aria-selected="{% if forloop.first %}true{% else %}false{% endif %}" data-role="{{ role }}">{{ role|title }}</button>{% endfor %}
      </div>
      <input type="hidden" name="role" id="selected-role" value="admin">
      <div style="margin-top:22px"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="submit" type="submit">Continue to NAAC</button>
    </form>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <p class="hint">Demo credentials: <strong>admin / admin</strong></p>
  </main>
  <script>
    const roleButtons = document.querySelectorAll('[data-role]');
    const roleField = document.getElementById('selected-role');
    roleButtons.forEach(button => button.addEventListener('click', () => {
      roleButtons.forEach(item => item.setAttribute('aria-selected', String(item === button)));
      roleField.value = button.dataset.role;
    }));
  </script>
</body>
</html>
