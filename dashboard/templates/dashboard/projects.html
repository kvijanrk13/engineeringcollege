<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            background: #F7F9FC;
            color: #172033;
            font-family: Arial, Helvetica, sans-serif;
        }
        .domain-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 20px;
        }
        .domain-tile {
            appearance: none;
            background: #FFFFFF;
            border: 1px solid #D8E0EA;
            border-radius: 8px;
            color: #172033;
            min-height: 146px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1.25;
            text-align: center;
        }
        .domain-tile:active {
            background: #EAF1F8;
            border-color: #1456A0;
        }
        .domain-icon {
            display: block;
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
        }
        @media (min-width: 761px) {
            .domain-grid { padding-top: 32px; }
        }
    </style>
</head>
<body>
    <main class="domain-grid" aria-label="Project domains">
        <button class="domain-tile" type="button">
            <svg class="domain-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#0E7490" d="M13,12h22a5,5 0,0 1,5 5v14a5,5 0,0 1,-5 5H13a5,5 0,0 1,-5 -5V17a5,5 0,0 1,5 -5z"/>
                <path fill="#F2B705" d="M16,20h4l5,12h-4l-1,-3h-5l-1,3h-4zM16,26h3l-1.5,-4zM29,20h4v12h-4z"/>
            </svg>
            <span>AI Domain</span>
        </button>

        <button class="domain-tile" type="button">
            <svg class="domain-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#2563EB" d="M10,26a7,7 0,1 1,7,-7a7,7 0,0 1,-7 7zM31,25a7,7 0,1 1,7,-7a7,7 0,0 1,-7 7zM22,42a7,7 0,1 1,7,-7a7,7 0,0 1,-7 7z"/>
                <path fill="none" stroke="#F2B705" stroke-width="4" d="M15,22L22,31M27,30L31,24M17,18h7"/>
            </svg>
            <span>Machine Learning Domain</span>
        </button>

        <button class="domain-tile" type="button">
            <svg class="domain-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#4338CA" d="M7,10h34a3,3 0,0 1,3 3v22a3,3 0,0 1,-3 3H7a3,3 0,0 1,-3 -3V13a3,3 0,0 1,3 -3z"/>
                <path fill="#F2B705" d="M15,18l-6,6l6,6l3,-3l-3,-3l3,-3zM33,18l6,6l-6,6l-3,-3l3,-3l-3,-3zM23,31l-4,-1l6,-13l4,1z"/>
            </svg>
            <span>Software Engineering Domain</span>
        </button>

        <button class="domain-tile" type="button">
            <svg class="domain-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#B91C1C" d="M24,5l16,7v10c0,10 -6,18 -16,22C14,40 8,32 8,22V12z"/>
                <path fill="#F2B705" d="M18,23h12v9H18zM20,21a4,4 0,0 1,8 0v2h-3v-2a1,1 0,0 0,-2 0v2h-3z"/>
            </svg>
            <span>Security Domain</span>
        </button>

        <button class="domain-tile" type="button">
            <svg class="domain-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#7C3AED" d="M24,6a14,14 0,0 1,14 14v9a9,9 0,0 1,-9 9h-2v5h-6v-5h-2a9,9 0,0 1,-9 -9v-9A14,14 0,0 1,24 6z"/>
                <path fill="none" stroke="#F2B705" stroke-width="3" d="M16,23h16M18,17h12M18,29h12M24,14v18"/>
            </svg>
            <span>Deep Learning Domain</span>
        </button>

        <button class="domain-tile" type="button">
            <svg class="domain-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#047857" d="M8,11c0,-5 32,-5 32,0v26c0,5 -32,5 -32,0z"/>
                <path fill="#F2B705" d="M13,20h5v14h-5zM21,15h5v19h-5zM29,24h5v10h-5z"/>
            </svg>
            <span>Data Science Domain</span>
        </button>

        <button class="domain-tile" type="button">
            <svg class="domain-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#0369A1" d="M17,36h19a8,8 0,0 0,1 -16a12,12 0,0 0,-23 -3a10,10 0,0 0,3 19z"/>
                <path fill="#F2B705" d="M22,23h4v8h-4zM17,27h14v4H17z"/>
            </svg>
            <span>Cloud Computing Domain</span>
        </button>

        <button class="domain-tile" type="button">
            <svg class="domain-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#B45309" d="M14,14h20a4,4 0,0 1,4 4v12a4,4 0,0 1,-4 4H14a4,4 0,0 1,-4 -4V18a4,4 0,0 1,4 -4z"/>
                <path fill="#F2B705" d="M18,21h12v6H18zM12,9h4v5h-4zM22,9h4v5h-4zM32,9h4v5h-4zM12,34h4v5h-4zM22,34h4v5h-4zM32,34h4v5h-4z"/>
            </svg>
            <span>IoT and Edge Computing Domain</span>
        </button>
    </main>
</body>
</html>
