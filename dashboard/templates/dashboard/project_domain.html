<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ domain_name }} Projects</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #F7F9FC;
            color: #172033;
            font-family: Arial, Helvetica, sans-serif;
        }
        main {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 24px 20px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 28px;
            color: #1456A0;
            font-weight: 700;
            text-decoration: none;
        }
        .folder {
            min-height: 320px;
            padding: 40px 24px;
            border: 1px solid #D8E0EA;
            border-radius: 8px;
            background: #FFFFFF;
            text-align: center;
        }
        .folder-icon {
            position: relative;
            display: block;
            width: 112px;
            height: 76px;
            margin: 26px auto 34px;
            border-radius: 8px;
            background: #0E7490;
        }
        .folder-icon::before {
            content: "";
            position: absolute;
            top: -18px;
            left: 0;
            width: 52px;
            height: 24px;
            border-radius: 8px 8px 0 0;
            background: #0E7490;
        }
        h1 {
            margin: 0;
            font-size: 26px;
            line-height: 1.3;
        }
        p {
            margin: 16px 0 0;
            color: #526174;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <a class="back-link" href="{% url 'dashboard:projects' %}">&larr; Project Domains</a>
        <section class="folder" aria-label="{{ domain_name }} project folder">
            <span class="folder-icon" aria-hidden="true"></span>
            <h1>{{ domain_name }} Projects</h1>
            <p>This folder is ready for {{ domain_name }} project resources and submissions.</p>
        </section>
    </main>
</body>
</html>
