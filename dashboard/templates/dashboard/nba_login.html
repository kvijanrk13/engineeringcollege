{% load static %}
<!DOCTYPE html><html><head><meta charset="utf-8"><title>NBA Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center"><div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h3 class="mb-3">NBA Accreditation Login</h3>
      <ul class="nav nav-tabs mb-3" id="roleTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#admin" type="button">Admin</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#principal" type="button">Principal</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#hod" type="button">HOD</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#staff" type="button">Staff</button></li>
      </ul>
      <div class="tab-content">
        {% for role in roles %}
        <div class="tab-pane fade {% if forloop.first %}show active{% endif %}" id="{{ role }}">
          <form method="post">
            {% csrf_token %}
            <input type="hidden" name="role" value="{{ role }}">
            <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
            <button class="btn btn-primary w-100">Login as {{ role|title }}</button>
          </form>
        </div>
        {% endfor %}
      </div>
      {% if error %}<div class="alert alert-danger mt-3">{{ error }}</div>{% endif %}
      <p class="small text-muted mt-3 mb-0">Default credentials: admin / admin</p>
    </div></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
