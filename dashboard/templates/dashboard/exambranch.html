<!-- faculty/dashboard/templates/exambranch/dashboard.html -->
{% extends 'base.html' %}
{% load static %}
{% load dashboard_filters %}

{% block title %}
Exam Branch - Teaching Plan
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center mb-4">
        <div class="col-lg-10">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="row gy-2 justify-content-center mb-3">
                            <div class="col-auto">
                                <input type="text" class="form-control" placeholder="Year" value="III" style="width: 80px;" />
                            </div>
                            <div class="col-auto">
                                <span class="align-middle">B.Tech</span>
                            </div>
                            <div class="col-auto">
                                <input type="text" class="form-control" placeholder="Semester" value="I" style="width: 80px;" />
                            </div>
                            <div class="col-auto">
                                <span class="align-middle">Sem Teaching Plan</span>
                            </div>
                        </div>
                    </div>
                    <div class="row gy-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Faculty :</label>
                            <input type="text" class="form-control" placeholder="Faculty Name" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Subject :</label>
                            <input type="text" class="form-control" placeholder="Subject Name" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Class :</label>
                            <input type="text" class="form-control" placeholder="Class" />
                        </div>
                    </div>
                    <div class="row gy-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Subject Code :</label>
                            <input type="text" class="form-control" placeholder="Subject Code" />
                        </div>
                    </div>
                    <div class="row gy-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">From :</label>
                            <input type="date" id="fromDate" class="form-control" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">To :</label>
                            <input type="date" id="toDate" class="form-control" />
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button id="addBtn" class="btn btn-primary w-100">ADD</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered text-center align-middle" id="teachingPlanTable">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">DATE</th>
                                    <th scope="col">DAY OF THE WEEK</th>
                                    <th scope="col">WEEK NO.</th>
                                    <th scope="col">CLASSES PER WEEK</th>
                                    <th scope="col">TOPICS TO BE COVERED</th>
                                </tr>
                            </thead>
                            <tbody id="teachingPlanBody">
                            </tbody>
                        </table>
                    </div>
                    <script>
                        function getWeekNumber(date) {
                            const d = new Date(date);
                            const firstDay = new Date(d.getFullYear(), 0, 1);
                            const dayOfWeek = firstDay.getDay();
                            const firstSunday = new Date(firstDay);
                            firstSunday.setDate(firstSunday.getDate() + (7 - dayOfWeek) % 7);
                            
                            if (d < firstSunday) {
                                return 1;
                            }
                            const diff = d - firstSunday;
                            const weekNum = Math.floor(diff / (7 * 24 * 60 * 60 * 1000)) + 1;
                            return weekNum;
                        }
                        
                        function getDayName(date) {
                            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                            const d = new Date(date);
                            return days[d.getDay()];
                        }
                        
                        function formatDate(date) {
                            const d = new Date(date);
                            const day = String(d.getDate()).padStart(2, '0');
                            const month = String(d.getMonth() + 1).padStart(2, '0');
                            const year = d.getFullYear();
                            return `${day}-${month}-${year}`;
                        }
                        
                        document.getElementById('addBtn').addEventListener('click', function() {
                            const fromDateStr = document.getElementById('fromDate').value;
                            const toDateStr = document.getElementById('toDate').value;
                            
                            if (!fromDateStr || !toDateStr) {
                                alert('Please select both From and To dates');
                                return;
                            }
                            
                            const fromDate = new Date(fromDateStr);
                            const toDate = new Date(toDateStr);
                            
                            if (fromDate > toDate) {
                                alert('From date must be before To date');
                                return;
                            }
                            
                            const tbody = document.getElementById('teachingPlanBody');
                            const dates = [];
                            let currentDate = new Date(fromDate);
                            
                            // Collect all dates
                            while (currentDate <= toDate) {
                                dates.push(new Date(currentDate));
                                currentDate.setDate(currentDate.getDate() + 1);
                            }
                            
                            // Group consecutive dates by week number
                            const groups = [];
                            let currentGroup = null;
                            
                            for (let i = 0; i < dates.length; i++) {
                                const weekNum = getWeekNumber(dates[i]);
                                
                                if (!currentGroup || currentGroup.weekNum !== weekNum) {
                                    currentGroup = {
                                        weekNum: weekNum,
                                        dates: [dates[i]]
                                    };
                                    groups.push(currentGroup);
                                } else {
                                    currentGroup.dates.push(dates[i]);
                                }
                            }
                            
                            // Create rows for each group
                            for (const group of groups) {
                                const rowspan = group.dates.length;
                                
                                for (let i = 0; i < group.dates.length; i++) {
                                    const row = document.createElement('tr');
                                    const dateCell = document.createElement('td');
                                    const dayCell = document.createElement('td');
                                    const weekCell = document.createElement('td');
                                    const classesCell = document.createElement('td');
                                    const topicsCell = document.createElement('td');
                                    
                                    dateCell.innerHTML = `<input type="text" class="form-control" value="${formatDate(group.dates[i])}" readonly />`;
                                    dayCell.innerHTML = `<input type="text" class="form-control" value="${getDayName(group.dates[i])}" readonly />`;
                                    
                                    if (i === 0) {
                                        // First row in group gets rowspan
                                        weekCell.innerHTML = `<input type="text" class="form-control" value="${group.weekNum}" readonly />`;
                                        weekCell.setAttribute('rowspan', rowspan);
                                    } else {
                                        // Subsequent rows in group skip week cell
                                        weekCell.style.display = 'none';
                                    }
                                    
                                    classesCell.innerHTML = `<input type="text" class="form-control" />`;
                                    topicsCell.innerHTML = `<input type="text" class="form-control" />`;
                                    
                                    row.appendChild(dateCell);
                                    row.appendChild(dayCell);
                                    if (i === 0) {
                                        row.appendChild(weekCell);
                                    }
                                    row.appendChild(classesCell);
                                    row.appendChild(topicsCell);
                                    
                                    tbody.appendChild(row);
                                }
                            }
                            
                            document.getElementById('fromDate').value = '';
                            document.getElementById('toDate').value = '';
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
