{% extends 'aeclibrary/base.html' %}
{% block heading %} Signup {% endblock heading %}

{% block content %}

<a class="flex items-center justify-center gap-3 w-full max-w-xs mx-auto mt-10 mb-6 px-4 py-3 bg-white text-gray-800 rounded border border-white hover:bg-gray-100"
   href="{% url 'dashboard:google_login' %}?role=student&target=aeclibrary">
  <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true" focusable="false">
    <path fill="#EA4335" d="M24 23.6 6 10.5V38h36V10.5L24 23.6Z"/>
    <path fill="#FBBC04" d="M6 10.5 24 23.6 42 10.5V9c0-1.3-3-3-3H9C7.3 6 6 7.3 6 9v1.5Z"/>
    <path fill="#34A853" d="M6 10.5V38h9V17.1L6 10.5Z"/>
    <path fill="#4285F4" d="M33 17.1V38h9V10.5l-9 6.6Z"/>
  </svg>
  <span class="font-semibold">Sign up with Gmail</span>
</a>

<div class="flex items-center justify-center w-full max-w-xs mx-auto my-2">
  <span class="text-gray-400 text-sm tracking-[0.3em]">OR</span>
</div>

<form class="w-full max-w-xs flex flex-col mx-auto" action="/aeclibrary/student/login/" method="POST">
  {% csrf_token %}
  <label class="text-sm text-gray-300 mb-1" for="username">Username</label>
  <input
    id="username"
    name="username"
    type="password"
    value="anrkstudent"
    class="px-2 py-1 bg-transparent border-white border-2 rounded text-white mb-3"
  />

  <label class="text-sm text-gray-300 mb-1" for="password">Password</label>
  <input
    id="password"
    name="password"
    type="password"
    value="7001"
    class="px-2 py-1 bg-transparent border-white border-2 rounded text-white mb-3"
  />

  <button type="submit" class="text-white rounded bg-green-500 px-4 py-2 mt-2 hover:shadow-md">Login</button>
</form>

{% endblock content %}
