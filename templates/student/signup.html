{% extends 'aeclibrary/base.html' %}
{% block heading %} Signup {% endblock heading %}

{% block content %}

<a class="flex items-center justify-center gap-3 w-full max-w-xs mx-auto mt-2 mb-6 px-4 py-2 bg-white text-gray-800 rounded border border-white hover:bg-gray-100"
   href="{% url 'dashboard:google_login' %}?role=student&target=aeclibrary">
  <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false">
    <path fill="#EA4335" d="M24 23.6 6 10.5V38h36V10.5L24 23.6Z"/>
    <path fill="#FBBC04" d="M6 10.5 24 23.6 42 10.5V9c0-1.3-3-3-3H9C7.3 6 6 7.3 6 9v1.5Z"/>
    <path fill="#34A853" d="M6 10.5V38h9V17.1L6 10.5Z"/>
    <path fill="#4285F4" d="M33 17.1V38h9V10.5l-9 6.6Z"/>
  </svg>
  <span class="font-semibold">Sign up with Gmail</span>
</a>

<form class="w-2xl sm:w-1/2 max-w-xs flex flex-col mx-auto -mt-8 sm:-mt-12" action="/aeclibrary/student/signup/" method="POST">
  {% csrf_token %}
  <div class="w-1/2  max-w-xs flex flex-col sm:flex-row mt-4  sm:items-center"></div>
    <label class="text-xl" for="firstname">Firstname</label>
    <input
      class="px-2 py-1 bg-transparent border-white border-2 h-lg mt-2 rounded "
      name="firstname"
      type="text"
      placeholder="firstname"
    />
  </div>
  <div class="w-1/2 max-w-xs flex flex-col sm:flex-row mt-4 sm:items-center"></div>
    <label class="text-xl" for="lastname">Lastname</label>
    <input
      class="px-2 py-1 bg-transparent border-white border-2 mt-2  rounded "
      name="lastname"
      type="text"
      placeholder="lastname"
    />
  </div>
  <div class="w-1/2  max-w-xs flex flex-col sm:flex-row mt-4  sm:items-center"></div>
  <label class="text-xl" for="studentID">StudentID</label>
  
  <input
    class="px-2 py-1 bg-transparent border-white border-2 h-lg mt-2 rounded "
    name="studentID"
    type="text"
    id="studentID"
    placeholder="studentID"
  />
  <p id="studentID-error" class="hidden text-red-400 py-1">ID either incomplete or exists</p>
</div>
</div>
<div class="w-1/2 max-w-xs flex flex-col sm:flex-row mt-4 sm:items-center"></div>
  <label class="text-xl" for="password">Password</label>
  <input
    class="px-2 py-1 bg-transparent border-white border-2 mt-2  rounded "
    name="password"
    type="password"
    placeholder="password"
  />
</div>
<div class="w-1/2 max-w-xs flex flex-col sm:flex-row mt-4 sm:items-center"></div>
<label class="text-xl" for="department">Department</label>
<select class="rounded border border-red-300 py-2 focus:outline-none focus:ring-2 focus:ring-red-200 mt-2 focus:border-red-500 text-base pl-3 pr-10 text-gray-800" name="department">
  <option   value="">Select a dept</option>
  {% for dept in departments %}
  <option   value="{{dept.id}}">{{dept}}</option>
  {% endfor %}
</select>
</div>
  
<button class="text-white hover:shadow-md text-xl rounded bg-green-500 px-4 py-2 mt-8 " type="submit">Submit</button>
</form>


<script>
const users="{{users | escapejs}}"; 
const idField=document.querySelector('#studentID');
const idError=document.querySelector('#studentID-error');
idField.addEventListener('input',()=>{
  idError.classList.add('hidden')
  if (users.includes(idField.value)){
    idError.classList.remove('hidden')
  }
})
</script>
{% endblock content %}
