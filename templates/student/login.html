{% extends 'aeclibrary/base.html' %}

{% block heading %} Login {% endblock heading %}


{% block content %}
{% if google_signin_enabled %}
<a class="flex items-center justify-center gap-3 w-full max-w-xs mx-auto mt-2 mb-6 px-4 py-2 bg-white text-gray-800 rounded border border-white hover:bg-gray-100"
   href="{% url 'dashboard:google_login' %}?role=student&target=aeclibrary">
  <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false">
    <path fill="#EA4335" d="M24 23.6 6 10.5V38h36V10.5L24 23.6Z"/>
    <path fill="#FBBC04" d="M6 10.5 24 23.6 42 10.5V9c0-1.7-1.3-3-3-3H9C7.3 6 6 7.3 6 9v1.5Z"/>
    <path fill="#34A853" d="M6 10.5V38h9V17.1L6 10.5Z"/>
    <path fill="#4285F4" d="M33 17.1V38h9V10.5l-9 6.6Z"/>
  </svg>
  <span class="font-semibold">Sign in with Gmail</span>
</a>
{% endif %}
<form class="w-2xl sm:w-1/2 max-w-xs flex flex-col mx-auto " action="/aeclibrary/student/login/" method="POST">
  {% csrf_token %}
  <div class="w-1/2  max-w-xs flex flex-col sm:flex-row mt-4  sm:items-center"></div>
    <label class="text-3xl" for="studentID">StudentID <span class="text-sm font-thin">(username for admin users)</span></label>
    <input
      class="px-2 py-1 bg-transparent border-white border-2 h-lg mt-4 rounded text-gray-100"
      name="studentID"
      type="text"
      placeholder="studentID (username for admin users)"
    />
  </div>
  <div class="w-1/2 max-w-xs flex flex-col sm:flex-row mt-4 sm:items-center"></div>
    <label class="text-3xl" for="password">Password</label>
    <input
      class="px-2 py-1 bg-transparent border-white border-2 mt-4  rounded text-gray-100"
      name="password"
      type="password"
      placeholder="password"
    />
  </div>
  {% if request.GET.next %}
  <input type="hidden" name="next" value="{{request.GET.next}}" />
  {% endif %}
  <button class="text-white hover:shadow-md text-xl rounded bg-pink-500 px-4 py-2 mt-8 " type="submit">Submit</button>
</form>

{% endblock content %}
