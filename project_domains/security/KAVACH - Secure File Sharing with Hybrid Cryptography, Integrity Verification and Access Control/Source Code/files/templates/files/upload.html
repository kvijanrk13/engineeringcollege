{% extends "base.html" %}

{% block title %}Upload Text File | KAVACH{% endblock %}

{% block content %}
<section class="auth-panel">
    <h1>Sender File Upload</h1>
    <p class="helper-text">Step 4 encrypts the Notepad file with AES-GCM before storage. The original file is not saved.</p>

    <form method="post" enctype="multipart/form-data" class="form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload and Encrypt File</button>
    </form>

    <p class="small-link"><a href="{% url 'files:my_files' %}">View My Files</a></p>
</section>
{% endblock %}
