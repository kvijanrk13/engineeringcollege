<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KAVACH{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'accounts:profile' %}">KAVACH</a>
        <nav class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}">Profile</a>
                <a href="{% url 'files:my_files' %}">My Files</a>
                <a href="{% url 'files:upload' %}">Upload</a>
                <a href="{% url 'accounts:logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">Login</a>
                <a href="{% url 'accounts:register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main class="page">
        {% if messages %}
            <section class="messages">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </section>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
    <script>
        document.querySelectorAll('.kavach-upload-form').forEach((form) => {
            const emailInput = form.querySelector('input[type="email"]');
            const fileInput = form.querySelector('input[type="file"]');
            const fileHint = form.querySelector('[data-file-hint]');

            if (emailInput) {
                emailInput.addEventListener('blur', () => {
                    emailInput.value = emailInput.value.trim().toLowerCase();
                });
            }

            if (fileInput && fileHint) {
                fileInput.addEventListener('change', () => {
                    const file = fileInput.files && fileInput.files[0];
                    fileHint.textContent = file ? `${file.name} selected` : 'No text file selected';
                });
            }
        });
    </script>
</body>
</html>
