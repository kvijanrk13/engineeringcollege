<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block page_title %}{{ title|default:"Used Car Price Prediction Using K-Radius Nearest Neighbors" }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0f172a;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --muted: #64748b;
      --text: #0f172a;
      --primary: #6366f1;
      --primary-2: #8b5cf6;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --shadow: 0 10px 30px rgba(15,23,42,0.12);
      --radius: 16px;
    }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 800px at 10% -10%, rgba(99,102,241,0.15), transparent),
                  radial-gradient(1200px 800px at 90% 10%, rgba(6,182,212,0.12), transparent),
                  linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 3D animated background shapes */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .55;
      animation: float 14s ease-in-out infinite;
    }
    .orb-1 { width: 420px; height: 420px; background: linear-gradient(135deg,#6366f1,#8b5cf6); top: -120px; left: -80px; }
    .orb-2 { width: 360px; height: 360px; background: linear-gradient(135deg,#06b6d4,#3b82f6); bottom: -90px; right: -70px; animation-delay: -7s; }
    .orb-3 { width: 280px; height: 280px; background: linear-gradient(135deg,#f59e0b,#ef4444); top: 40%; left: 55%; animation-delay: -4s; opacity: .35; }
    @keyframes float {
      0%,100% { transform: translate3d(0,0,0) scale(1); }
      50% { transform: translate3d(30px,-40px,0) scale(1.08); }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: saturate(140%) blur(18px);
      background: rgba(255,255,255,0.72);
      border-bottom: 1px solid rgba(226,232,240,0.8);
    }
    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      transform-style: preserve-3d;
    }
    nav strong {
      flex: 1 0 100%;
      margin-right: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 18px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    nav a {
      color: #1e293b;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
      position: relative;
    }
    nav a:hover {
      transform: translateY(-2px) rotateX(4deg);
      background: rgba(99,102,241,0.08);
      box-shadow: var(--shadow);
    }
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* Typography */
    h1 { font-size: 34px; margin: 0 0 14px; letter-spacing: -0.03em; }
    h2 { font-size: 22px; margin: 0 0 12px; letter-spacing: -0.02em; }
    h3 { font-size: 17px; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.65; }

    /* Cards & surfaces */
    section, .panel, article, .step-card {
      background: rgba(255,255,255,0.82);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    section:hover, article:hover, .step-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(15,23,42,0.18);
    }

    /* Buttons */
    button, .button, .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: auto;
      border: 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 12px;
      transition: transform .15s ease, filter .2s ease;
      box-shadow: 0 8px 20px rgba(99,102,241,0.25);
    }
    button:hover, .button:hover, .action:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    /* Forms */
    label {
      display: block;
      margin-bottom: 8px;
      color: #0f172a;
      font-weight: 700;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.9);
      font-size: 15px;
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Metrics */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .metric {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(248,250,252,0.9));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), var(--shadow);
      transform: translateZ(0);
      transition: transform .25s ease;
    }
    .metric strong {
      display: block;
      font-size: 22px;
      margin-top: 8px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: linear-gradient(180deg, #eef2ff, #f8fafc);
      color: #0f172a;
      font-weight: 700;
    }

    /* Code */
    pre {
      overflow-x: auto;
      margin: 0;
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(180deg, #0b1020, #0f172a);
      color: #f8fafc;
      font-size: 13px;
      line-height: 1.55;
      border: 1px solid rgba(255,255,255,0.06);
    }
    code { font-family: Consolas, Monaco, "Courier New", monospace; }

    /* Utilities */
    .errorlist {
      margin: 8px 0 0;
      padding-left: 18px;
      color: var(--danger);
    }
    .tilt { transform-style: preserve-3d; perspective: 800px; }
    .tilt-inner { transform: translateZ(18px); }
  </style>
</head>
<body>
  <div class="bg-scene" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <header>
    <nav>
      <strong>{{ title|default:"Used Car Price Prediction Using K-Radius Nearest Neighbors" }}</strong>
      <a href="{% url 'registration' %}">Gmail Sign In</a>
      <a href="{% url 'maruti-prices' %}">Maruti Prices</a>
      <a href="{% url 'research-paper' %}">Research Paper</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
