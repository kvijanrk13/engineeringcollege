{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Acknowledge Absence Alert</h1>
        <p>{{ notification.message }}</p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary">Submit Acknowledgement</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
