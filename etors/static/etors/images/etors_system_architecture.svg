<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">ETORS layered system architecture</title>
  <desc id="desc">Passengers, cab drivers, and administrators use responsive web interfaces. Requests pass through authentication and security to Django application modules and services, then through the ORM to PostgreSQL, with Google OAuth and Render deployment integrations.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#163d70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1f3a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/>
    </marker>
    <style>
      .label{font:700 22px Arial,sans-serif;fill:#0b1f3a}.small{font:600 17px Arial,sans-serif;fill:#36516f}.white{fill:#fff}.layer{rx:20;filter:url(#shadow)}.box{rx:14;fill:#fff;stroke:#b9cee8;stroke-width:2}.flow{stroke:#2b6cb0;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="920" rx="28" fill="url(#page)"/>
  <rect x="40" y="30" width="1320" height="78" rx="18" fill="url(#navy)"/>
  <text x="700" y="64" text-anchor="middle" class="label white" font-size="28">ETORS — E-Ticketing Online Reservation System</text>
  <text x="700" y="91" text-anchor="middle" class="small white">Layered Django Architecture</text>

  <rect class="layer" x="80" y="145" width="1240" height="110" fill="#dbeafe"/>
  <text x="105" y="178" class="label">Users Layer</text>
  <rect class="box" x="315" y="170" width="220" height="58"/><text x="425" y="205" text-anchor="middle" class="small">Passenger</text>
  <rect class="box" x="590" y="170" width="220" height="58"/><text x="700" y="205" text-anchor="middle" class="small">Cab Driver</text>
  <rect class="box" x="865" y="170" width="220" height="58"/><text x="975" y="205" text-anchor="middle" class="small">Administrator</text>

  <path class="flow" d="M700 255 L700 290"/>
  <rect class="layer" x="80" y="295" width="1240" height="105" fill="#e0f2fe"/>
  <text x="105" y="328" class="label">Presentation Layer</text>
  <text x="700" y="338" text-anchor="middle" class="small">Responsive Django Templates · HTML5 · CSS3 · JavaScript</text>
  <text x="700" y="373" text-anchor="middle" class="small">Search · Booking · Payment · PNR · Cab Dispatch · Documentation · Chatbot</text>

  <path class="flow" d="M700 400 L700 435"/>
  <rect class="layer" x="80" y="440" width="1240" height="105" fill="#ede9fe"/>
  <text x="105" y="473" class="label">Authentication &amp; Security Layer</text>
  <text x="700" y="483" text-anchor="middle" class="small">Google Gmail Identity · Session Authorization · CSRF Protection · HTTPS</text>
  <text x="700" y="518" text-anchor="middle" class="small">PNR + Mobile Verification · Hashed Pickup OTP · Private UUID Dispatch Token</text>

  <path class="flow" d="M700 545 L700 580"/>
  <rect class="layer" x="80" y="585" width="1240" height="135" fill="#dcfce7"/>
  <text x="105" y="618" class="label">Django Application &amp; Business Services</text>
  <rect class="box" x="180" y="635" width="190" height="58"/><text x="275" y="670" text-anchor="middle" class="small">URLs &amp; Views</text>
  <rect class="box" x="395" y="635" width="190" height="58"/><text x="490" y="670" text-anchor="middle" class="small">Forms</text>
  <rect class="box" x="610" y="635" width="190" height="58"/><text x="705" y="670" text-anchor="middle" class="small">Services</text>
  <rect class="box" x="825" y="635" width="190" height="58"/><text x="920" y="670" text-anchor="middle" class="small">Models &amp; ORM</text>
  <rect class="box" x="1040" y="635" width="190" height="58"/><text x="1135" y="660" text-anchor="middle" class="small">Atomic</text><text x="1135" y="682" text-anchor="middle" class="small">Transactions</text>

  <path class="flow" d="M700 720 L700 755"/>
  <rect class="layer" x="80" y="760" width="760" height="120" fill="#fff7ed"/>
  <text x="105" y="793" class="label">Data Layer</text>
  <text x="460" y="810" text-anchor="middle" class="small">PostgreSQL Relational Database</text>
  <text x="460" y="840" text-anchor="middle" class="small">Stations · Trains · Bookings · Passengers</text>
  <text x="460" y="865" text-anchor="middle" class="small">Cab Bookings · Payment Status · Call Logs</text>

  <rect class="layer" x="875" y="760" width="445" height="120" fill="#fef3c7"/>
  <text x="900" y="793" class="label">Integration &amp; Deployment</text>
  <text x="1098" y="830" text-anchor="middle" class="small">Google OAuth · Render Cloud</text>
  <text x="1098" y="858" text-anchor="middle" class="small">Git Deploy · Migrations · Static Files</text>
  <path class="flow" d="M840 820 L865 820"/>
</svg>
