plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = false

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }

    hasReleaseKeystore = keystoreProperties.storeFile &&
            keystoreProperties.storePassword &&
            keystoreProperties.keyAlias &&
            keystoreProperties.keyPassword
}

android {
    namespace "com.anrkit.engineeringcollegeprojects"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProperties.storeFile)
                storePassword keystoreProperties.storePassword
                keyAlias keystoreProperties.keyAlias
                keyPassword keystoreProperties.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.anrkit.engineeringcollegeprojects"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "WEB_APP_URL", "\"https://engineeringcollege.onrender.com/\""
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"

            buildConfigField "String", "WEB_APP_URL", "\"https://engineeringcollege.onrender.com/\""
        }

        release {
            buildConfigField "String", "WEB_APP_URL", "\"https://engineeringcollege.onrender.com/\""

            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"

            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}
