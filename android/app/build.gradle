plugins {
    id "com.android.application"
}

android {
    namespace "com.anrkit.engineeringcollegeprojects"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.anrkit.engineeringcollegeprojects"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "WEB_APP_URL", "\"https://engineeringcollege.onrender.com/\""
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "String", "WEB_APP_URL", "\"http://10.0.2.2:8000/\""
        }

        release {
            buildConfigField "String", "WEB_APP_URL", "\"https://engineeringcollege.onrender.com/\""
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
