# render.yaml
databases:
  - name: anrkitdept-db
    databaseName: anrkitdept
    user: anrkitdept_user
    plan: free

services:
  - type: web
    name: anrkitdept
    runtime: python
    pythonVersion: 3.11.9
    buildCommand: ./build.sh
    startCommand: gunicorn engineeringcollege.wsgi:application
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anrkitdept-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "True"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false