databases:
  - name: anrkitdept-db
    databaseName: anrkitdept
    user: anrkitdept_user
    plan: free

services:
  - type: web
    name: anrkitdept
    runtime: python
    pythonVersion: 3.10.11
    buildCommand: ./build.sh
    startCommand: bash -c "python manage.py migrate --noinput && (python manage.py createsuperuser --noinput --username $DJANGO_SUPERUSER_USERNAME --email $DJANGO_SUPERUSER_EMAIL || true) && gunicorn engineeringcollege.wsgi:application --log-file -"
    plan: free
    apt:
      packages:
        - libpango-1.0-0
        - libpangocairo-1.0-0
        - libcairo2
        - libgdk-pixbuf2.0-0
        - libffi-dev
        - libxml2
        - libxslt1.1
        - shared-mime-info
        - libpangoft2-1.0-0
        - fonts-dejavu-core
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anrkitdept-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: RENDER
        value: "True"
      - key: CLOUDINARY_CLOUD_NAME
        value: "dsndiruhe"  # ← Fixed - removed the 'h'
      - key: CLOUDINARY_API_KEY
        value: "473455725389669"  # ← Your actual API key
      - key: CLOUDINARY_API_SECRET
        value: "vztmkO4bDwTVvVNG7Mah9yPmkdY"  # ← Your actual secret
      - key: ALLOWED_HOSTS
        value: "engineeringcollege.onrender.com,anrkitdept.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://engineeringcollege.onrender.com,https://anrkitdept.onrender.com"
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@anrkitdept.onrender.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "admin123"